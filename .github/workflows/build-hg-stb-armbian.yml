#==========================================================================
# Description: Build Armbian arm64 khusus STB HG (HG680P / HG680-FJ)
# Based on: ophub/amlogic-s9xxx-armbian build-armbian-arm64-server-image.yml
# Target : HG680P/BTV-9/BTV-10 (SoC s905x) dan HG680-FJ (SoC s905x2)
#==========================================================================

name: Build Armbian STB HG680

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      set_release:
        description: "Select OS Release."
        required: false
        default: "noble"
        type: choice
        options:
          - noble
          - bookworm
          - trixie
          - resolute
      stb_model:
        description: "Pilih model STB HG."
        required: false
        default: "s905x"
        type: choice
        options:
          - s905x            # HG680P, BTV-9, BTV-10(BX) - meson-gxl-s905x-p212
          - s905x2-hg680fj   # HG680-FJ - meson-g12a-hg680-fj
          - s905x-t95        # T95 (referensi, s905x)
      armbian_kernel:
        description: "Select kernel version."
        required: false
        default: "6.12.y"
        type: choice
        options:
          - 6.1.y
          - 6.6.y
          - 6.12.y
          - 6.18.y
      kernel_usage:
        description: "Set the tags of the stable kernel."
        required: false
        default: "stable"
        type: choice
        options:
          - stable
          - flippy
          - beta
      armbian_fstype:
        description: "Select armbian rootfs type."
        required: false
        default: "ext4"
        type: choice
        options:
          - ext4
          - btrfs
      build_minimal:
        description: "yes = hemat ROM (buang 58 paket non-esensial). no = paket penuh (ada build-essential, git, mc, dll)."
        required: false
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"
      extra_packages:
        description: "Paket tambahan dipisah spasi (mis: git wireguard). Hanya relevan saat build_minimal=yes."
        required: false
        default: "zram-tools"
      static_ip:
        description: "IP statis STB (CIDR). Contoh: 192.168.4.3/24"
        required: false
        default: "192.168.4.4/24"
      gateway_ip:
        description: "Gateway / DNS STB."
        required: false
        default: "192.168.4.1"
      builder_name:
        description: "Set Armbian builder signature."
        required: false
        default: "ophub"
        type: choice
        options:
          - ophub
          - angel
      config_board:
        description: "Set the base Armbian board name."
        required: false
        default: "odroidn2"

env:
  TZ: Etc/UTC
  ROOTFS_SCRIPT: compile-kernel/tools/script/docker/build_armbian_rootfs_file.sh

jobs:
  build:
    runs-on: ubuntu-24.04
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    permissions:
      contents: write

    name: build-armbian-hg680-${{ inputs.stb_model }}-${{ inputs.set_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize the build environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2404-build-armbian-depends)
          sudo systemctl daemon-reload
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
          sudo rm -rf ~/{.cargo,.dotnet,.rustup}
          sudo timedatectl set-timezone "${TZ:-Etc/UTC}"
          sudo ntpdate ntp.ubuntu.com 0.pool.ntp.org || true
          sudo timedatectl set-ntp true
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Create virtual disk for extended storage
        id: disk
        run: |
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Error: Insufficient space on /: ${root_avail}G available"; exit 1; }

          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          echo "Using /: ${root_size}G"

          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          df -Th
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Download Armbian source code
        id: down
        working-directory: /builder
        if: ${{ steps.init.outputs.status == 'success' && !cancelled() }}
        run: |
          df -hT ${PWD}
          git clone -q --single-branch --depth=1 --branch=main https://github.com/armbian/build.git build
          ln -sf /builder/build ${{ github.workspace }}/build
          ln -sf /builder/build /home/runner/work/_actions/ophub/amlogic-s9xxx-armbian/main/build
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Add extra packages via userpatches customize-image.sh
        id: patches
        working-directory: /builder/build
        if: ${{ steps.down.outputs.status == 'success' && !cancelled() }}
        run: |
          EXTRA="${{ inputs.extra_packages }}"
          STATIC_IP="${{ inputs.static_ip }}"
          GATEWAY="${{ inputs.gateway_ip }}"
          mkdir -p userpatches
          cat > userpatches/customize-image.sh <<EOF
          #!/bin/bash
          # Hook kustomisasi image - dijalankan di chroot rootfs saat build
          # \$1=RELEASE \$2=LINUXFAMILY \$3=BOARD \$4=BUILD_DESKTOP \$5=VARIANT \$6=BUILD_MINIMAL
          set -e
          export DEBIAN_FRONTEND=noninteractive

          # --- IP statis via netplan (persisten, DHCP dimatikan) ---
          mkdir -p /etc/netplan
          cat > /etc/netplan/00-static-ip.yaml <<NETPLAN
          network:
            version: 2
            renderer: networkd
            ethernets:
              eth0:
                dhcp4: no
                addresses:
                  - ${STATIC_IP}
                routes:
                  - to: 0.0.0.0/0
                    via: ${GATEWAY}
                nameservers:
                  addresses:
                    - 9.9.9.9
                    - 9.9.9.10
          NETPLAN
          chmod 600 /etc/netplan/00-static-ip.yaml

          # --- Buang netplan match-all (ditulis ekstensi networkd SETELAH file ini
          #     disalin ke rootfs; match "e*" menang di networkd → IP statis tidak
          #     pernah terpakai di perangkat nyata) ---
          rm -f /etc/netplan/10-dhcp-all-interfaces.yaml /etc/netplan/10-dhcp-*.yaml

          # --- zram (zramswap dari zram-tools) + ramlog aktif sejak boot ---
          #     armbian-zram-config TIDAK di-enable agar tidak double-swap
          #     dengan zramswap.service; keduanya pakai zramctl -f jadi aman.
          mkdir -p /etc/systemd/system/multi-user.target.wants \
                   /etc/systemd/system/sysinit.target.wants
          ln -sf /lib/systemd/system/zramswap.service \
                 /etc/systemd/system/multi-user.target.wants/
          ln -sf /lib/systemd/system/armbian-ramlog.service \
                 /etc/systemd/system/sysinit.target.wants/

          # --- wpa_supplicant mati (STB HG tidak punya wifi) ---
          rm -f /etc/systemd/system/multi-user.target.wants/wpa_supplicant.service \\
                /lib/systemd/system/multi-user.target.wants/wpa_supplicant.service

          # --- extra packages ---
          apt-get update || true
          if [ -n "${EXTRA}" ]; then
            echo "[customize] Installing extra packages: ${EXTRA}"
            apt-get install -y --no-install-recommends ${EXTRA} || true
          fi
          apt-get clean || true
          rm -rf /var/lib/apt/lists/* 2>/dev/null || true
          exit 0
          EOF
          chmod +x userpatches/customize-image.sh
          echo "extra packages: [${EXTRA}] | static ip: [${STATIC_IP}] via [${GATEWAY}]"
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Compile Armbian [ ${{ inputs.set_release }} ]
        id: compile
        working-directory: /builder
        if: ${{ steps.down.outputs.status == 'success' && !cancelled() }}
        run: |
          # Enable QEMU emulation for ARM cross-compilation
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes 2>/dev/null || true

          # Set the board name for the base Armbian image
          config_board="${{ inputs.config_board }}"
          [[ -z "${config_board}" ]] && config_board="odroidn2"

          # Compile options reference: https://docs.armbian.com/Developer-Guide_Build-Options
          cd build/
              ./compile.sh RELEASE=${{ inputs.set_release }} BOARD=${config_board} BRANCH=current BUILD_MINIMAL=${{ inputs.build_minimal }} \
                           BUILD_ONLY=default HOST=armbian BUILD_DESKTOP=no EXPERT=yes KERNEL_CONFIGURE=no \
                           COMPRESS_OUTPUTIMAGE="sha" SHARE_LOG=yes

          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Organize output files and reclaim disk space
        id: clean
        if: ${{ steps.compile.outputs.status == 'success' && !cancelled() }}
        run: |
          chmod +x ${ROOTFS_SCRIPT}
          ${ROOTFS_SCRIPT} -v ${{ inputs.set_release }} -s true -c true -k true -p arm64

          cd build/
          rm -rf $(ls . | grep -v "^output$" | xargs) 2>/dev/null

          df -hT ${PWD}
          echo "build_tag=Armbian_HG680_${{ inputs.set_release }}_arm64_$(date +%Y.%m)" >> ${GITHUB_ENV}
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Upload Armbian image to Release
        uses: ophub/upload-to-releases@main
        if: ${{ steps.clean.outputs.status == 'success' && !cancelled() }}
        with:
          tag: ${{ env.build_tag }}
          artifacts: build/output/images/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild Armbian for STB HG target
        uses: ophub/amlogic-s9xxx-armbian@main
        if: ${{ steps.clean.outputs.status == 'success' && !cancelled() }}
        with:
          build_target: armbian
          armbian_path: build/output/images/*.img.gz
          armbian_board: ${{ inputs.stb_model }}
          armbian_kernel: ${{ inputs.armbian_kernel }}
          auto_kernel: true
          kernel_repo: ophub/kernel
          kernel_usage: ${{ inputs.kernel_usage }}
          armbian_fstype: ${{ inputs.armbian_fstype }}
          builder_name: ${{ inputs.builder_name }}

      - name: Disable eMMC HS200 in DTB (fix mmc error -74)
        id: hsfix
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        run: |
          # Chip eMMC murah di STB HG (mis. DG4008) tidak stabil di mode HS200:
          # dmesg "mmc_select_hs200 failed, error -74" lalu driver mundur ke
          # DDR52 50MHz (tulis ~24MB/s). Hapus deklarasi mmc-hs200-1_8v dari
          # semua DTB di partisi boot image hasil rebuild + batasi frekuensi
          # eMMC 50MHz via cmdline (dokumentasi ophub).
          sudo apt-get install -y device-tree-compiler >/dev/null 2>&1
          STB_MODEL="${{ inputs.stb_model }}"
          # Pilih image hasil REBUILD target (filter model STB) - pola sama dgn step verify;
          # glob tanpa filter salah ambil image trunk (bahan mentah).
          IMG=$(ls build/output/images/Armbian_*${STB_MODEL}_*.img.gz 2>/dev/null | head -1)
          [[ -z "$IMG" ]] && IMG=$(ls ${PACKAGED_OUTPUTPATH}/Armbian_*${STB_MODEL}_*.img.gz 2>/dev/null | head -1)
          if [[ -z "$IMG" ]]; then
            echo "::warning::image hasil rebuild ($STB_MODEL) tidak ditemukan, patch DTB dilewati"
            echo "status=skipped" >> ${GITHUB_OUTPUT}
            exit 0
          fi
          echo "Patching DTB in [ $IMG ] ..."
          zcat "$IMG" > /tmp/fix.img
          LOOP=$(sudo losetup -fP --show /tmp/fix.img)
          FIXED=0
          for p in ${LOOP}p*; do
            T=$(sudo blkid -o value -s TYPE "$p" 2>/dev/null || true)
            [[ "$T" == "vfat" ]] || continue
            MNT=$(mktemp -d)
            sudo mount "$p" "$MNT"
            # (1) buang mmc-hs200-1_8v dari semua DTB di partisi boot
            while IFS= read -r DTB; do
              dtc -I dtb -O dts -o /tmp/f.dts "$DTB" 2>/dev/null || continue
              grep -q 'mmc-hs200-1_8v' /tmp/f.dts || continue
              sed -i '/mmc-hs200-1_8v;/d' /tmp/f.dts
              if dtc -I dts -O dtb -o /tmp/f.dtb /tmp/f.dts 2>/dev/null; then
                sudo cp /tmp/f.dtb "$DTB"
                echo "patched: ${DTB#$MNT}"
                FIXED=$((FIXED+1))
              else
                echo "::warning::dtc gagal compile ulang $DTB"
              fi
            done < <(find "$MNT" -name '*.dtb' -type f)
            # (2) cmdline batas frekuensi eMMC 50MHz (belt-and-braces)
            if [[ -f "$MNT/uEnv.txt" ]] && ! grep -q 'mmc_core.max_freq=' "$MNT/uEnv.txt"; then
              sudo sed -i 's|^APPEND=\(.*\)$|APPEND=\1 mmc_core.max_freq=50000000|' "$MNT/uEnv.txt"
              echo "uEnv.txt: mmc_core.max_freq=50000000 ditambahkan"
            fi
            sudo umount "$MNT"
            rmdir "$MNT"
          done
          sudo losetup -d "$LOOP"
          if [[ "$FIXED" -eq 0 ]]; then
            echo "::warning::tidak ada DTB ber-mmc-hs200-1_8v yang ditemukan"
          fi
          gzip -c /tmp/fix.img > "$IMG"
          rm -f /tmp/fix.img
          # perbarui checksum sampingan bila ada
          for SHAF in "$IMG".sha*; do
            [[ -f "$SHAF" ]] || continue
            (cd "$(dirname "$IMG")" && sha256sum "$(basename "$IMG")" > "$(basename "$SHAF")")
          done
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Verify static IP & boot config baked into image
        id: verify
        if: ${{ steps.clean.outputs.status == 'success' && !cancelled() }}
        run: |
          # Cari file hasil rebuild target
          STATIC_IP="${{ inputs.static_ip }}"
          IMG=$(ls build/output/images/Armbian_*${{ inputs.stb_model }}_*.img.gz 2>/dev/null | head -1)
          [[ -z "$IMG" ]] && IMG=$(ls ${PACKAGED_OUTPUTPATH:-/tmp/nonexistent}/*.img.gz 2>/dev/null | head -1)
          if [[ -z "$IMG" ]]; then
            echo "::warning::File image hasil rebuild tidak ditemukan untuk diverifikasi"
            echo "status=skipped" >> ${GITHUB_OUTPUT}
            exit 0
          fi
          echo "Verifying [ $IMG ] ..."

          # --- Fallback lama: grep string mentah di dalam .img.gz ---
          if ! zcat "$IMG" | grep -aq "${STATIC_IP%/*}"; then
            echo "::error::Static IP ${{ inputs.static_ip }} TIDAK ditemukan di dalam image!"
            echo "status=failed" >> ${GITHUB_OUTPUT}
            exit 1
          fi
          echo "OK: static IP ${{ inputs.static_ip }} ter-bake di dalam image"

          # --- Verifikasi mendalam: mount partisi root & cek isi nyata ---
          FAIL=0
          zcat "$IMG" > /tmp/chk.img
          LOOP=$(sudo losetup -fP --show /tmp/chk.img 2>/dev/null || true)
          if [[ -z "$LOOP" ]]; then
            echo "::warning::losetup gagal - verifikasi mendalam dilewati (grep string tetap lolos)"
          else
            ROOT=""
            for p in ${LOOP}p*; do
              if sudo debugfs -R "ls -p /etc/netplan" "$p" 2>/dev/null | grep -q "00-static-ip"; then
                ROOT="$p"; break
              fi
            done
            if [[ -z "$ROOT" ]]; then
              echo "::error::Partisi root dengan /etc/netplan tidak ditemukan di image!"
              FAIL=1
            else
              echo "root partition: $ROOT"
              NP=$(sudo debugfs -R "ls -p /etc/netplan" "$ROOT" 2>/dev/null)
              echo "netplan: $NP"

              # (1) file statis ada & isinya IP yang benar
              if ! echo "$NP" | grep -q "00-static-ip.yaml"; then
                echo "::error::00-static-ip.yaml hilang dari image!"; FAIL=1
              fi
              if ! sudo debugfs -R "cat /etc/netplan/00-static-ip.yaml" "$ROOT" 2>/dev/null | grep -q "${STATIC_IP%/*}"; then
                echo "::error::Isi 00-static-ip.yaml tidak berisi ${STATIC_IP}!"; FAIL=1
              fi

              # (2) netplan match-all DHCP HARUS sudah dibuang (kalau tidak,
              #     networkd memilih match "e*" → IP statis tidak pernah aktif)
              if echo "$NP" | grep -q "10-dhcp-all-interfaces"; then
                echo "::error::10-dhcp-all-interfaces.yaml masih ada - IP statis akan kalah lagi!"; FAIL=1
              else
                echo "OK: netplan match-all DHCP sudah dibuang"
              fi

              # (3) zram + ramlog enabled sejak boot
              for spec in "multi-user.target.wants:zramswap.service" "sysinit.target.wants:armbian-ramlog.service"; do
                DIR="${spec%%:*}"; UNIT="${spec##*:}"
                WANTS=$(sudo debugfs -R "ls -p /etc/systemd/system/$DIR" "$ROOT" 2>/dev/null)
                if echo "$WANTS" | grep -q "$UNIT"; then
                  echo "OK: $UNIT enabled"
                else
                  echo "::error::$UNIT TIDAK enabled di image!"; FAIL=1
                fi
              done

              # (4) wpa_supplicant tidak boleh auto-start (tidak ada wifi)
              MULTI=$(sudo debugfs -R "ls -p /etc/systemd/system/multi-user.target.wants" "$ROOT" 2>/dev/null)
              if echo "$MULTI" | grep -q "wpa_supplicant"; then
                echo "::error::wpa_supplicant masih auto-start di image!"; FAIL=1
              else
                echo "OK: wpa_supplicant disabled"
              fi
            fi

            # (5) patch HS200: partisi boot vfat → mount utk verifikasi
            for p in ${LOOP}p*; do
              T=$(sudo blkid -o value -s TYPE "$p" 2>/dev/null || true)
              [[ "$T" == "vfat" ]] || continue
              MNT=$(mktemp -d)
              sudo mount "$p" "$MNT"
              HS_LEFT=0; DTB_N=0
              while IFS= read -r DTB; do
                DTB_N=$((DTB_N+1))
                dtc -I dtb -O dts -o /tmp/v.dts "$DTB" 2>/dev/null || continue
                grep -q 'mmc-hs200-1_8v' /tmp/v.dts && HS_LEFT=$((HS_LEFT+1))
              done < <(find "$MNT" -name '*.dtb' -type f)
              echo "DTB diperiksa: $DTB_N, masih ada mmc-hs200-1_8v: $HS_LEFT"
              if [[ "$HS_LEFT" -ne 0 ]]; then
                echo "::error::DTB masih memuat mmc-hs200-1_8v - patch HS200 tidak masuk!"; FAIL=1
              else
                echo "OK: deklarasi mmc-hs200-1_8v sudah dibuang dari semua DTB"
              fi
              if grep -q 'mmc_core.max_freq=50000000' "$MNT/uEnv.txt" 2>/dev/null; then
                echo "OK: mmc_core.max_freq=50000000 ada di uEnv.txt"
              else
                echo "::error::mmc_core.max_freq tidak ada di uEnv.txt!"; FAIL=1
              fi
              sudo umount "$MNT"; rmdir "$MNT"
            done
            sudo losetup -d "$LOOP" 2>/dev/null || true
            rm -f /tmp/chk.img
          fi

          if [[ "${FAIL}" -ne 0 ]]; then
            echo "status=failed" >> ${GITHUB_OUTPUT}
            exit 1
          fi
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Upload rebuilt STB image to Release
        uses: ophub/upload-to-releases@main
        if: ${{ env.PACKAGED_STATUS == 'success' && steps.verify.outputs.status != 'failed' && !cancelled() }}
        with:
          tag: ${{ env.build_tag }}
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### Armbian Image STB HG680
            - Target: `${{ inputs.stb_model }}` (HG680P / HG680-FJ)
            - Release: `${{ inputs.set_release }}` — kernel `${{ inputs.armbian_kernel }}` (${{ inputs.kernel_usage }})
            - Static IP: `${{ inputs.static_ip }}` via `${{ inputs.gateway_ip }}` (netplan match-all DHCP dibuang → statis menang)
            - zram + armbian-ramlog: aktif sejak boot (hemat tulis eMMC)
            - Extra packages: `${{ inputs.extra_packages || '-' }}`
            - Default username: `root`
            - Default password: `1234`
            - Install command: `armbian-install`
            - Update command: `armbian-update`
            ### Applicable Platform
            - 🐧 `arm64`
            - 📡 DTB meson: dipilih otomatis sesuai model STB
            - 🔧 eMMC HS200 dimatikan di DTB + batas 50MHz (fix `error -74` → stabil di DDR52)
            - ✅ Static IP diverifikasi ada di dalam image saat build
            - Build: [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
