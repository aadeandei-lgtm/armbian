name: Analyze RK3399 Reference Image

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fdisk e2fsprogs binutils file device-tree-compiler

      - name: Download reference image (470 MB)
        run: |
          curl -fL --retry 3 --retry-delay 5 -o ref.img.gz "https://files.kos.org.cn/rockchip/YSKJ_RK3399/Armbian/armbian_21.05_server_full.img.gz"
          gzip -t ref.img.gz && echo "gzip integrity: OK"
          ls -lh ref.img.gz

      - name: Decompress + partition table
        run: |
          gzip -d -k ref.img.gz
          stat -c 'image bytes: %s' ref.img | tee partition.txt
          sudo fdisk -l ref.img | tee -a partition.txt

      - name: Extract partition + pad sparse to claimed size
        run: |
          # partisi mulai sector 32768 (16 MB)
          dd if=ref.img of=root.img bs=512 skip=32768 status=progress
          # ukuran klaim dari superblock
          BLOCKS=$(sudo dumpe2fs -h root.img 2>/dev/null | awk '/^Block count/{print $3}')
          BS=$(sudo dumpe2fs -h root.img 2>/dev/null | awk '/^Block size/{print $3}')
          echo "fs claims: $BLOCKS blocks x $BS = $((BLOCKS*BS)) bytes" | tee -a partition.txt
          truncate -s $((BLOCKS*BS)) root.img
          ls -lh root.img; du -h root.img
          sudo dumpe2fs -h root.img 2>/dev/null | tee superblock.txt

      - name: Extract /boot and rootfs identity (debugfs, no mount)
        run: |
          touch boot-list.txt boot-config.txt dtb-list.txt rootfs-info.txt
          mkdir -p bootdump
          sudo debugfs -R "ls -p /" root.img 2>&1 | tee boot-list.txt
          echo "=== /boot ===" | tee -a boot-list.txt
          sudo debugfs -R "ls -l /boot" root.img 2>&1 | tee -a boot-list.txt
          echo "=== rdump /boot ===" | tee -a boot-list.txt
          sudo debugfs -R "rdump /boot ./bootdump" root.img 2>&1 | tee -a boot-list.txt || true
          find ./bootdump -type f -printf '%P %s bytes\n' | sort | tee -a boot-list.txt || true

          echo "=== boot config ===" | tee boot-config.txt
          for f in ./bootdump/armbianEnv.txt ./bootdump/uEnv.txt ./bootdump/extlinux/extlinux.conf ./bootdump/boot.cmd; do
            if [ -f "$f" ]; then echo "----- $f -----" | tee -a boot-config.txt; cat "$f" | tee -a boot-config.txt; fi
          done
          if [ -f ./bootdump/boot.scr ]; then
            echo "----- boot.scr (strings) -----" | tee -a boot-config.txt
            strings ./bootdump/boot.scr | head -80 | tee -a boot-config.txt
          fi

          echo "=== DTB files ===" | tee dtb-list.txt
          find ./bootdump -iname '*.dtb' -printf '%P %s bytes\n' | sort | tee -a dtb-list.txt || true

          echo "=== armbian-release ===" | tee rootfs-info.txt
          sudo debugfs -R "cat /etc/armbian-release" root.img 2>/dev/null | tee -a rootfs-info.txt || true
          echo "=== os-release ===" | tee -a rootfs-info.txt
          sudo debugfs -R "cat /etc/os-release" root.img 2>/dev/null | tee -a rootfs-info.txt || true
          echo "=== /lib/modules ===" | tee -a rootfs-info.txt
          sudo debugfs -R "ls -p /lib/modules" root.img 2>/dev/null | tee -a rootfs-info.txt || true
          echo "=== /extlinux in root ===" | tee -a rootfs-info.txt
          sudo debugfs -R "ls -l /etc" root.img 2>/dev/null | grep -i extlinux | tee -a rootfs-info.txt || true
          echo "=== kernel image ===" | tee -a rootfs-info.txt
          for k in ./bootdump/Image ./bootdump/Image.gz ./bootdump/zImage; do
            if [ -f "$k" ]; then ls -l "$k" | tee -a rootfs-info.txt; strings -n 12 "$k" | grep -m2 'Linux version' | tee -a rootfs-info.txt || true; fi
          done

      - name: Bootloader signature
        run: |
          echo "=== MBR hexdump ===" | tee bootloader.txt
          head -c 512 ref.img | od -Ax -tx1z -v | tee -a bootloader.txt
          echo "=== bootloader strings (first 16MB) ===" | tee -a bootloader.txt
          head -c 16777216 ref.img | strings -n 8 | grep -iE 'u-boot|rk3399|idbloader|spl|ddr|armbian|version' | sort -u | head -60 | tee -a bootloader.txt

      - name: DTB decompile
        run: |
          touch dtb-decompiled.txt
          for d in $(find ./bootdump -iname '*.dtb' | sort); do
            echo "===== $d =====" | tee -a dtb-decompiled.txt
            dtc -I dtb -O dts "$d" 2>&1 | head -80 | tee -a dtb-decompiled.txt || true
          done
          [ -s dtb-decompiled.txt ] || echo "(no dtb found)" | tee -a dtb-decompiled.txt
          # sanity: magic bytes semua dtb
          echo "=== dtb magic check ===" | tee -a dtb-decompiled.txt
          for d in $(find ./bootdump -iname '*.dtb' | sort); do
            printf '%s : ' "$d"; head -c4 "$d" | od -An -tx1 | tr -d ' \n'; echo | tee -a dtb-decompiled.txt
          done || true

      - name: Raw carve DTB from image (FDT magic scan)
        run: |
          mkdir -p carved
          python3 - <<'PY'
          import struct, os, subprocess
          MAGIC = bytes([0xd0, 0x0d, 0xfe, 0xed])
          data = open('ref.img','rb').read()
          found = []
          i = 0
          while True:
              j = data.find(MAGIC, i)
              if j < 0: break
              # ukuran dtb dari header big-endian di offset 4
              if j + 40 <= len(data):
                  totalsize = struct.unpack('>I', data[j+4:j+8])[0]
                  if 64 <= totalsize <= 262144 and j + totalsize <= len(data):
                      name = f'carved/dtb-{len(found):02d}-off-{j:x}.dtb'
                      open(name,'wb').write(data[j:j+totalsize])
                      found.append((name, j, totalsize))
              i = j + 4
          print(f'carved {len(found)} DTB candidates')
          for n,o,s in found: print(f'  {n} offset=0x{o:x} size={s}')
          PY
          echo "=== carved dtb dtc check ===" | tee carved-dtb.txt
          for d in carved/*.dtb; do
            [ -f "$d" ] || continue
            echo "----- $d -----" | tee -a carved-dtb.txt
            dtc -I dtb -O dts "$d" 2>&1 | grep -m6 -E 'model|compatible' | tee -a carved-dtb.txt || true
          done
          # filename search di raw image
          echo "=== .dtb filenames in raw image ===" | tee -a carved-dtb.txt
          strings -n 6 ref.img | grep -E '\.dtb$' | sort -u | head -60 | tee -a carved-dtb.txt || true

      - name: Build report
        run: |
          : > REPORT.txt
          for f in partition.txt superblock.txt boot-list.txt boot-config.txt dtb-list.txt rootfs-info.txt bootloader.txt dtb-decompiled.txt carved-dtb.txt; do
            if [ -f "$f" ]; then echo "########## $f ##########" >> REPORT.txt; cat "$f" >> REPORT.txt; fi
          done
          echo "REPORT lines: $(wc -l < REPORT.txt)"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: rk3399-analysis
          path: |
            REPORT.txt
            partition.txt
            superblock.txt
            boot-config.txt
            dtb-list.txt
            rootfs-info.txt
            bootloader.txt
            dtb-decompiled.txt
            carved-dtb.txt
            carved/
            bootdump/
          if-no-files-found: warn
